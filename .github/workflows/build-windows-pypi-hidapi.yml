name: Build Windows EXE (PyPI hidapi)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install app dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install hidapi
          python -c "import hid; print(hid.__file__)"

      - name: Build exe
        shell: pwsh
        run: |
          python -m PyInstaller `
            --noconfirm `
            --clean `
            --windowed `
            --onedir `
            --name MyHidApp `
            --collect-all PySide6 `
            --hidden-import hid `
            --add-data "pico-pinout-1-green.jpg;." `
            basic_app.py

      - name: Zip output
        shell: pwsh
        run: |
          Compress-Archive -Path dist/MyHidApp/* -DestinationPath dist/MyHidApp-windows-pypi-hidapi.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyHidApp-windows-pypi-hidapi
          path: dist/MyHidApp-windows-pypi-hidapi.zip
