name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install app dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip setuptools wheel Cython
          pip install -r requirements.txt

      - name: Build and install cython-hidapi
        shell: pwsh
        run: |
          git clone --recursive https://github.com/trezor/cython-hidapi.git
          Set-Location cython-hidapi
          python -m pip install . --no-build-isolation
          python -c "import hid; print(hid.__file__)"

      - name: Build exe
        shell: pwsh
        run: |
          python -m PyInstaller `
            --noconfirm `
            --clean `
            --windowed `
            --onedir `
            --name MyHidApp `
            --collect-all PySide6 `
            --hidden-import hid `
            --add-data "pico-pinout-1-green.jpg;." `
            basic_app.py

      - name: Zip output
        shell: pwsh
        run: |
          Compress-Archive -Path dist/MyHidApp/* -DestinationPath dist/MyHidApp-windows.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyHidApp-windows
          path: dist/MyHidApp-windows.zip
